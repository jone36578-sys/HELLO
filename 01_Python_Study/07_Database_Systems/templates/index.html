<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Database Forge</title><style> :root{--bg:#111827;--surface:#172033;--accent:#38bdf8;--text:#e6f6ff;--muted:color-mix(in srgb,var(--text) 62%,transparent)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}.chat{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:220px;max-height:58vh;padding:18px}.msg{max-width:82%;padding:13px 16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:var(--accent);color:var(--bg)}.msg.model{align-self:flex-start;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}.meta{font-size:11px;opacity:.6;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}.typing{opacity:.65;font-style:italic}.composer{display:flex;gap:10px;padding:14px}.composer input{flex:1;min-width:0;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--surface);color:var(--text);outline:none}.composer button,header button{border:0;background:var(--accent);color:var(--bg);padding:12px 18px;font-weight:800}header{display:flex;align-items:center;gap:14px}h1,h2,p{margin:0}small,span{color:var(--muted)}.dash-head{padding:16px 4%%;background:#0d1525;border-bottom:1px solid #26364f}.app-icon{width:42px;height:42px;display:grid;place-items:center;background:var(--accent);color:#04101a;border-radius:10px}.dash-head>div:nth-child(2){flex:1}.dash-head h1{font-size:20px}.dash-actions{display:flex;gap:10px;align-items:center}.chip{font-size:9px;border:1px solid #34506c;padding:6px 9px;border-radius:20px}.dash-head button{background:#1d2b40;color:var(--text);border:1px solid #34506c}.dash-grid{width:min(1150px,94%%);margin:24px auto;display:grid;grid-template-columns:210px 1fr;gap:18px}.dash-grid aside{display:flex;flex-direction:column;gap:12px}.metric{padding:15px;background:var(--surface);border:1px solid #273951;border-radius:12px}.metric span{display:block;font-size:9px;letter-spacing:.15em}.metric b{display:block;margin-top:7px}.panel{background:#0c1422;border:1px solid #273951;border-radius:14px;overflow:hidden}.panel-title{display:flex;justify-content:space-between;padding:17px;border-bottom:1px solid #273951}.panel-title em{font-size:10px;color:var(--accent);font-style:normal}.chat{background:#0a111c}.composer{background:#0a111c}.composer input{border-radius:8px}.composer button{border-radius:8px}@media(max-width:700px){.paper,.shield-layout,.dash-grid{grid-template-columns:1fr}.paper aside,.shield-layout aside,.dash-grid aside{display:none}.chat{max-height:55vh}.msg{max-width:92%%}.brute-head{display:block}.brute-head button{margin-top:16px}.dash-actions .chip{display:none}}</style></head><body><header class="dash-head"><div class="app-icon">▦</div><div><h1>{{ config.TITLE }}</h1><small>{{ config.DOMAIN }}</small></div><div class="dash-actions"><span class="chip">TEMP SESSION</span><button id="clearBtn">Clear</button></div></header><main class="dash-grid"><aside><div class="metric"><span>MODEL</span><b>Gemini 3.1</b></div><div class="metric"><span>DOMAIN</span><b>{{ config.SHORT_LABEL }}</b></div><div class="metric"><span>MODE</span><b>Focused</b></div></aside><section class="panel"><div class="panel-title"><span>{{ config.WELCOME }}</span><em>● Ready</em></div><div id="chat" class="chat"></div><form id="chatForm" class="composer"><input id="message" autocomplete="off" maxlength="{{ config.MAX_INPUT_CHARS }}" placeholder="Ask a study question..." /><button type="submit">Send</button></form></section></main><script>const csrf="{{ csrf }}";const chat=document.getElementById("chat"),form=document.getElementById("chatForm"),input=document.getElementById("message"),clearBtn=document.getElementById("clearBtn");function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function render(h){chat.innerHTML="";h.forEach(m=>{const e=document.createElement("div");e.className="msg "+(m.role==="user"?"user":"model");e.innerHTML=`<div class="meta">${m.role==="user"?"You":"Tutor"}</div>${esc(m.text)}`;chat.appendChild(e)});chat.scrollTop=chat.scrollHeight;}async function send(e){e.preventDefault();const message=input.value.trim();if(!message){input.focus();return;}input.disabled=true;input.value="";const t=document.createElement("div");t.className="msg model typing";t.textContent="Thinking…";chat.appendChild(t);chat.scrollTop=chat.scrollHeight;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,csrf})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");render(d.history||[]);}catch(err){t.remove();const e=document.createElement("div");e.className="msg model";e.innerHTML=`<div class="meta">Error</div>${esc(err.message)}`;chat.appendChild(e);}finally{input.disabled=false;input.focus();}}async function clearChat(){try{const r=await fetch("/api/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({csrf})});if(r.ok)chat.innerHTML="";else alert("Could not clear this session.");}catch(e){alert("Could not clear this session.");}}form.addEventListener("submit",send);clearBtn.addEventListener("click",clearChat);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});</script></body></html>
