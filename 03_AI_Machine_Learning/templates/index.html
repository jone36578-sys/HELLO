<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071c22"><title>AI Learning Lab</title><style> :root{--bg:#071c22;--surface:#0b2c35;--accent:#72f6e0;--text:#e9fffb;--muted:color-mix(in srgb,var(--text) 62%,transparent)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}.chat{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:220px;max-height:58vh;padding:18px}.msg{max-width:82%;padding:13px 16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:var(--accent);color:var(--bg)}.msg.model{align-self:flex-start;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}.meta{font-size:11px;opacity:.6;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}.typing{opacity:.65;font-style:italic}.composer{display:flex;gap:10px;padding:14px}.composer input{flex:1;min-width:0;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--surface);color:var(--text);outline:none}.composer button,header button{border:0;background:var(--accent);color:var(--bg);padding:12px 18px;font-weight:800}header{display:flex;align-items:center;gap:14px}h1,h2,p{margin:0}small,span{color:var(--muted)}body{background:radial-gradient(circle at 10% 10%,#155e63,transparent 32%),radial-gradient(circle at 90% 20%,#243c9b,transparent 30%),var(--bg)}.aurora-head{padding:26px 6%;background:#ffffff0d;backdrop-filter:blur(16px)}.orb{width:46px;height:46px;border-radius:50%;background:var(--accent);box-shadow:0 0 40px var(--accent)}.aurora-head>div:nth-child(2){flex:1}.aurora-head span{font-size:10px;letter-spacing:.18em}.aurora-head h1{font-size:28px}.aurora-head button{border-radius:30px}.aurora-main{width:min(850px,92%);margin:30px auto;background:#ffffff0a;border:1px solid #ffffff1c;border-radius:28px;padding:24px;backdrop-filter:blur(14px)}.welcome-card{padding:12px 8px 24px}.welcome-card small{color:var(--accent);letter-spacing:.15em}.welcome-card h2{font-size:clamp(24px,4vw,40px);margin:10px 0}.chat{background:#00000018;border-radius:20px}.composer{margin-top:14px;background:#00000018;border-radius:18px}.composer input{border-radius:14px}.composer button{border-radius:50%;width:48px;height:48px;padding:0}@media(max-width:700px){.paper,.shield-layout,.dash-grid{grid-template-columns:1fr}.paper aside,.shield-layout aside,.dash-grid aside{display:none}.chat{max-height:55vh}.msg{max-width:92%}.brute-head{display:block}.brute-head button{margin-top:16px}.dash-actions .chip{display:none}}</style></head><body><header class="aurora-head"><div class="orb"></div><div><span>LEARNING CONSTELLATION</span><h1>{{ config.TITLE }}</h1><p>{{ config.DOMAIN }}</p></div><button id="clearBtn">Reset</button></header><main class="aurora-main"><div class="welcome-card"><small>WELCOME</small><h2>{{ config.WELCOME }}</h2><p>Your AI tutor is tuned to one academic domain.</p></div><section id="chat" class="chat"></section><form id="chatForm" class="composer"><input id="message" autocomplete="off" maxlength="{{ config.MAX_INPUT_CHARS }}" placeholder="Ask something within the domain..." /><button type="submit">↗</button></form></main><script>const csrf="{{ csrf }}";const chat=document.getElementById("chat"),form=document.getElementById("chatForm"),input=document.getElementById("message"),clearBtn=document.getElementById("clearBtn");function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function render(h){chat.innerHTML="";h.forEach(m=>{const e=document.createElement("div");e.className="msg "+(m.role==="user"?"user":"model");e.innerHTML=`<div class="meta">${m.role==="user"?"You":"Tutor"}</div>${esc(m.text)}`;chat.appendChild(e)});chat.scrollTop=chat.scrollHeight;}async function send(e){e.preventDefault();const message=input.value.trim();if(!message){input.focus();return;}input.disabled=true;input.value="";const t=document.createElement("div");t.className="msg model typing";t.textContent="Thinking…";chat.appendChild(t);chat.scrollTop=chat.scrollHeight;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,csrf})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");render(d.history||[]);}catch(err){t.remove();const e=document.createElement("div");e.className="msg model";e.innerHTML=`<div class="meta">Error</div>${esc(err.message)}`;chat.appendChild(e);}finally{input.disabled=false;input.focus();}}async function clearChat(){try{const r=await fetch("/api/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({csrf})});if(r.ok)chat.innerHTML="";else alert("Could not clear this session.");}catch(e){alert("Could not clear this session.");}}form.addEventListener("submit",send);clearBtn.addEventListener("click",clearChat);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});</script></body></html>
