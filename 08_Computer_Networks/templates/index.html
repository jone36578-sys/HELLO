<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b18"><title>Network Navigator</title><style> :root{--bg:#050b18;--surface:#0b1630;--accent:#a78bfa;--text:#f0eaff;--muted:color-mix(in srgb,var(--text) 62%,transparent)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}.chat{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:220px;max-height:58vh;padding:18px}.msg{max-width:82%;padding:13px 16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:var(--accent);color:var(--bg)}.msg.model{align-self:flex-start;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}.meta{font-size:11px;opacity:.6;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}.typing{opacity:.65;font-style:italic}.composer{display:flex;gap:10px;padding:14px}.composer input{flex:1;min-width:0;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--surface);color:var(--text);outline:none}.composer button,header button{border:0;background:var(--accent);color:var(--bg);padding:12px 18px;font-weight:800}header{display:flex;align-items:center;gap:14px}h1,h2,p{margin:0}small,span{color:var(--muted)}body{background:radial-gradient(circle at 50% 30%,#182a58,var(--bg) 55%)}.orbit-head{padding:25px 5%;justify-content:space-between}.planet{width:52px;height:52px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;font-size:30px;box-shadow:0 0 30px #a78bfa55}.orbit-head>div:nth-child(2){flex:1}.orbit-head span{font-size:9px;letter-spacing:.2em;color:var(--accent)}.orbit-head h1{margin:4px 0}.orbit-head button{border-radius:22px;background:#ffffff0d;color:var(--text);border:1px solid #ffffff2b}.orbit-main{width:min(850px,92%);margin:25px auto}.orbit-note{padding:22px;border:1px solid #ffffff1a;border-radius:22px;background:#ffffff08;margin-bottom:16px}.orbit-note b{color:var(--accent);letter-spacing:.12em}.orbit-note p{margin-top:8px}.chat{border-radius:22px;background:#030815aa}.msg{border-radius:18px}.msg.user{border-bottom-right-radius:4px}.msg.model{border-bottom-left-radius:4px}.composer{background:#ffffff09;border:1px solid #ffffff18;border-radius:22px;margin-top:12px}.composer input{border:0;background:transparent}.composer button{border-radius:50%;width:48px;height:48px;padding:0}@media(max-width:700px){.paper,.shield-layout,.dash-grid{grid-template-columns:1fr}.paper aside,.shield-layout aside,.dash-grid aside{display:none}.chat{max-height:55vh}.msg{max-width:92%}.brute-head{display:block}.brute-head button{margin-top:16px}.dash-actions .chip{display:none}}</style></head><body><header class="orbit-head"><div class="planet">◎</div><div><span>NETWORK NAVIGATOR</span><h1>{{ config.TITLE }}</h1><small>{{ config.DOMAIN }}</small></div><button id="clearBtn">Reset</button></header><main class="orbit-main"><div class="orbit-note"><b>{{ config.SHORT_LABEL }}</b><p>{{ config.WELCOME }}</p></div><div id="chat" class="chat"></div><form id="chatForm" class="composer"><input id="message" autocomplete="off" maxlength="{{ config.MAX_INPUT_CHARS }}" placeholder="Send a packet of knowledge…" /><button type="submit">➜</button></form></main><script>const csrf="{{ csrf }}";const chat=document.getElementById("chat"),form=document.getElementById("chatForm"),input=document.getElementById("message"),clearBtn=document.getElementById("clearBtn");function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function render(h){chat.innerHTML="";h.forEach(m=>{const e=document.createElement("div");e.className="msg "+(m.role==="user"?"user":"model");e.innerHTML=`<div class="meta">${m.role==="user"?"You":"Tutor"}</div>${esc(m.text)}`;chat.appendChild(e)});chat.scrollTop=chat.scrollHeight;}async function send(e){e.preventDefault();const message=input.value.trim();if(!message){input.focus();return;}input.disabled=true;input.value="";const t=document.createElement("div");t.className="msg model typing";t.textContent="Thinking…";chat.appendChild(t);chat.scrollTop=chat.scrollHeight;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,csrf})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");render(d.history||[]);}catch(err){t.remove();const e=document.createElement("div");e.className="msg model";e.innerHTML=`<div class="meta">Error</div>${esc(err.message)}`;chat.appendChild(e);}finally{input.disabled=false;input.focus();}}async function clearChat(){try{const r=await fetch("/api/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({csrf})});if(r.ok)chat.innerHTML="";else alert("Could not clear this session.");}catch(e){alert("Could not clear this session.");}}form.addEventListener("submit",send);clearBtn.addEventListener("click",clearChat);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});</script></body></html>
