<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Kernel Desk</title><style> :root{--bg:#050505;--surface:#101010;--accent:#f4d35e;--text:#fff9dc;--muted:color-mix(in srgb,var(--text) 62%,transparent)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}.chat{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:220px;max-height:58vh;padding:18px}.msg{max-width:82%;padding:13px 16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:var(--accent);color:var(--bg)}.msg.model{align-self:flex-start;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}.meta{font-size:11px;opacity:.6;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}.typing{opacity:.65;font-style:italic}.composer{display:flex;gap:10px;padding:14px}.composer input{flex:1;min-width:0;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--surface);color:var(--text);outline:none}.composer button,header button{border:0;background:var(--accent);color:var(--bg);padding:12px 18px;font-weight:800}header{display:flex;align-items:center;gap:14px}h1,h2,p{margin:0}small,span{color:var(--muted)}body{background:repeating-linear-gradient(0deg,#000 0,#000 2px,#050505 2px,#050505 4px)}.kernel-head{padding:18px 5%%;border-bottom:1px solid #4a4320;background:#090909}.console{color:var(--accent);font-weight:900}.kernel-head>div:nth-child(2){flex:1}.kernel-head h1{font-size:18px}.kernel-head button{background:transparent;color:var(--accent);border:1px solid var(--accent)}.kernel-main{width:min(900px,94%%);margin:25px auto}.boot{padding:15px;color:#aaa;background:#090909;border:1px solid #333;line-height:1.7;font-size:12px;margin-bottom:15px}.chat{background:#020202;border:1px solid #333}.msg{border-radius:2px}.msg.user{background:#26220d;color:var(--accent);border-left:3px solid var(--accent)}.msg.model{background:#0b0b0b;border-left:3px solid #555}.composer{background:#080808;border:1px solid #333}.composer input{background:#000;border:0;color:var(--accent)}@media(max-width:700px){.paper,.shield-layout,.dash-grid{grid-template-columns:1fr}.paper aside,.shield-layout aside,.dash-grid aside{display:none}.chat{max-height:55vh}.msg{max-width:92%%}.brute-head{display:block}.brute-head button{margin-top:16px}.dash-actions .chip{display:none}}</style></head><body><header class="kernel-head"><div class="console">KERNEL://</div><div><h1>{{ config.TITLE }}</h1><small>{{ config.DOMAIN }}</small></div><button id="clearBtn">flush()</button></header><main class="kernel-main"><div class="boot">[SYSTEM] Focus mode enabled<br>[SCOPE] {{ config.DOMAIN }}<br>[SESSION] temporary</div><div id="chat" class="chat"></div><form id="chatForm" class="composer"><span>$</span><input id="message" autocomplete="off" maxlength="{{ config.MAX_INPUT_CHARS }}" placeholder="Enter study query..." /><button type="submit">↵</button></form></main><script>const csrf="{{ csrf }}";const chat=document.getElementById("chat"),form=document.getElementById("chatForm"),input=document.getElementById("message"),clearBtn=document.getElementById("clearBtn");function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function render(h){chat.innerHTML="";h.forEach(m=>{const e=document.createElement("div");e.className="msg "+(m.role==="user"?"user":"model");e.innerHTML=`<div class="meta">${m.role==="user"?"You":"Tutor"}</div>${esc(m.text)}`;chat.appendChild(e)});chat.scrollTop=chat.scrollHeight;}async function send(e){e.preventDefault();const message=input.value.trim();if(!message){input.focus();return;}input.disabled=true;input.value="";const t=document.createElement("div");t.className="msg model typing";t.textContent="Thinking…";chat.appendChild(t);chat.scrollTop=chat.scrollHeight;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,csrf})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");render(d.history||[]);}catch(err){t.remove();const e=document.createElement("div");e.className="msg model";e.innerHTML=`<div class="meta">Error</div>${esc(err.message)}`;chat.appendChild(e);}finally{input.disabled=false;input.focus();}}async function clearChat(){try{const r=await fetch("/api/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({csrf})});if(r.ok)chat.innerHTML="";else alert("Could not clear this session.");}catch(e){alert("Could not clear this session.");}}form.addEventListener("submit",send);clearBtn.addEventListener("click",clearChat);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});</script></body></html>
