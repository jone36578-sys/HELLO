<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0e6"><title>Data Science Atlas</title><style> :root{--bg:#f5f0e6;--surface:#fffdf8;--accent:#b65d2a;--text:#2e241d;--muted:color-mix(in srgb,var(--text) 62%,transparent)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}.chat{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:220px;max-height:58vh;padding:18px}.msg{max-width:82%;padding:13px 16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:var(--accent);color:var(--bg)}.msg.model{align-self:flex-start;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}.meta{font-size:11px;opacity:.6;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}.typing{opacity:.65;font-style:italic}.composer{display:flex;gap:10px;padding:14px}.composer input{flex:1;min-width:0;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--surface);color:var(--text);outline:none}.composer button,header button{border:0;background:var(--accent);color:var(--bg);padding:12px 18px;font-weight:800}header{display:flex;align-items:center;gap:14px}h1,h2,p{margin:0}small,span{color:var(--muted)}.mast{padding:35px 7%;border-bottom:3px solid var(--accent);justify-content:space-between}.kicker{letter-spacing:.18em;font-size:11px;color:var(--accent)}.mast h1{font-size:clamp(30px,5vw,64px);margin:8px 0}.round{border:2px solid var(--accent);border-radius:999px;background:transparent!important;color:var(--accent)!important}.paper{width:min(1050px,92%);margin:30px auto;display:grid;grid-template-columns:220px 1fr;gap:50px}.quote{font-size:20px;line-height:1.35;border-top:5px solid var(--accent);padding-top:14px}.scope{margin-top:40px;font-size:12px;line-height:1.8}.welcome{padding:8px 0 25px;border-bottom:1px solid #d2c8b7}.welcome span{color:var(--accent);font-size:11px}.welcome h2{font-size:28px;margin:10px 0}.chat{padding:25px 0}.composer{border-top:1px solid #d2c8b7}.composer input{background:transparent;border:0;border-bottom:2px solid var(--accent)}.composer button{border-radius:50px}@media(max-width:700px){.paper,.shield-layout,.dash-grid{grid-template-columns:1fr}.paper aside,.shield-layout aside,.dash-grid aside{display:none}.chat{max-height:55vh}.msg{max-width:92%}.brute-head{display:block}.brute-head button{margin-top:16px}.dash-actions .chip{display:none}}</style></head><body><header class="mast"><div><span class="kicker">{{ config.SHORT_LABEL }}</span><h1>{{ config.TITLE }}</h1><p>{{ config.DOMAIN }}</p></div><button id="clearBtn" class="round">↻ New</button></header><main class="paper"><aside><div class="quote">“Learn one concept well, then connect it to the next.”</div><div class="scope">SCOPE<br><strong>{{ config.DOMAIN }}</strong></div></aside><section class="reader"><div class="welcome"><span>STUDY NOTE</span><h2>{{ config.WELCOME }}</h2><p>Focused answers, clear explanations, no unrelated topics.</p></div><div id="chat" class="chat"></div><form id="chatForm" class="composer"><input id="message" autocomplete="off" maxlength="{{ config.MAX_INPUT_CHARS }}" placeholder="Write a study question…" /><button type="submit">Ask</button></form></section></main><script>const csrf="{{ csrf }}";const chat=document.getElementById("chat"),form=document.getElementById("chatForm"),input=document.getElementById("message"),clearBtn=document.getElementById("clearBtn");function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function render(h){chat.innerHTML="";h.forEach(m=>{const e=document.createElement("div");e.className="msg "+(m.role==="user"?"user":"model");e.innerHTML=`<div class="meta">${m.role==="user"?"You":"Tutor"}</div>${esc(m.text)}`;chat.appendChild(e)});chat.scrollTop=chat.scrollHeight;}async function send(e){e.preventDefault();const message=input.value.trim();if(!message){input.focus();return;}input.disabled=true;input.value="";const t=document.createElement("div");t.className="msg model typing";t.textContent="Thinking…";chat.appendChild(t);chat.scrollTop=chat.scrollHeight;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,csrf})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");render(d.history||[]);}catch(err){t.remove();const e=document.createElement("div");e.className="msg model";e.innerHTML=`<div class="meta">Error</div>${esc(err.message)}`;chat.appendChild(e);}finally{input.disabled=false;input.focus();}}async function clearChat(){try{const r=await fetch("/api/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({csrf})});if(r.ok)chat.innerHTML="";else alert("Could not clear this session.");}catch(e){alert("Could not clear this session.");}}form.addEventListener("submit",send);clearBtn.addEventListener("click",clearChat);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});</script></body></html>
