<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f2efe7"><title>WebCraft Academy</title><style> :root{--bg:#f2efe7;--surface:#fffaf0;--accent:#ff5a36;--text:#171717;--muted:color-mix(in srgb,var(--text) 62%,transparent)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}.chat{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:220px;max-height:58vh;padding:18px}.msg{max-width:82%;padding:13px 16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:var(--accent);color:var(--bg)}.msg.model{align-self:flex-start;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}.meta{font-size:11px;opacity:.6;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}.typing{opacity:.65;font-style:italic}.composer{display:flex;gap:10px;padding:14px}.composer input{flex:1;min-width:0;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--surface);color:var(--text);outline:none}.composer button,header button{border:0;background:var(--accent);color:var(--bg);padding:12px 18px;font-weight:800}header{display:flex;align-items:center;gap:14px}h1,h2,p{margin:0}small,span{color:var(--muted)}body{background:var(--bg)}.brute-head{padding:25px 5%;border-bottom:5px solid #171717;justify-content:space-between}.stamp{display:inline-block;border:3px solid var(--accent);padding:5px 8px;font-weight:900;transform:rotate(-2deg)}.brute-head h1{font-size:clamp(34px,7vw,76px);line-height:.9;margin:15px 0}.brute-head button{background:#171717;color:#fff;border:3px solid #171717}.brute-main{width:min(980px,92%);margin:25px auto}.manifest{border:3px solid #171717;padding:15px;margin-bottom:18px;box-shadow:7px 7px 0 var(--accent)}.chat{border:3px solid #171717;background:#fff}.msg{border:3px solid #171717}.msg.model{background:#fff}.composer{border:3px solid #171717;margin-top:18px}.composer input{background:#fff;border:0}.composer button{border:0}@media(max-width:700px){.paper,.shield-layout,.dash-grid{grid-template-columns:1fr}.paper aside,.shield-layout aside,.dash-grid aside{display:none}.chat{max-height:55vh}.msg{max-width:92%}.brute-head{display:block}.brute-head button{margin-top:16px}.dash-actions .chip{display:none}}</style></head><body><header class="brute-head"><div><div class="stamp">{{ config.SHORT_LABEL }}</div><h1>{{ config.TITLE }}</h1><p>{{ config.DOMAIN }}</p></div><button id="clearBtn">CLEAR ALL</button></header><main class="brute-main"><div class="manifest"><b>RULE:</b> domain questions only.<br><b>MODE:</b> study / explain / practice.</div><section id="chat" class="chat"></section><form id="chatForm" class="composer"><input id="message" autocomplete="off" maxlength="{{ config.MAX_INPUT_CHARS }}" placeholder="TYPE YOUR QUESTION" /><button type="submit">SEND →</button></form></main><script>const csrf="{{ csrf }}";const chat=document.getElementById("chat"),form=document.getElementById("chatForm"),input=document.getElementById("message"),clearBtn=document.getElementById("clearBtn");function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function render(h){chat.innerHTML="";h.forEach(m=>{const e=document.createElement("div");e.className="msg "+(m.role==="user"?"user":"model");e.innerHTML=`<div class="meta">${m.role==="user"?"You":"Tutor"}</div>${esc(m.text)}`;chat.appendChild(e)});chat.scrollTop=chat.scrollHeight;}async function send(e){e.preventDefault();const message=input.value.trim();if(!message){input.focus();return;}input.disabled=true;input.value="";const t=document.createElement("div");t.className="msg model typing";t.textContent="Thinking…";chat.appendChild(t);chat.scrollTop=chat.scrollHeight;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,csrf})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");render(d.history||[]);}catch(err){t.remove();const e=document.createElement("div");e.className="msg model";e.innerHTML=`<div class="meta">Error</div>${esc(err.message)}`;chat.appendChild(e);}finally{input.disabled=false;input.focus();}}async function clearChat(){try{const r=await fetch("/api/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({csrf})});if(r.ok)chat.innerHTML="";else alert("Could not clear this session.");}catch(e){alert("Could not clear this session.");}}form.addEventListener("submit",send);clearBtn.addEventListener("click",clearChat);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});</script></body></html>
