<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d1f"><title>Cloud Orbit</title><style> :root{--bg:#090d1f;--surface:#121936;--accent:#8ea7ff;--text:#eef1ff;--muted:color-mix(in srgb,var(--text) 62%,transparent)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}.chat{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:220px;max-height:58vh;padding:18px}.msg{max-width:82%;padding:13px 16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:var(--accent);color:var(--bg)}.msg.model{align-self:flex-start;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}.meta{font-size:11px;opacity:.6;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}.typing{opacity:.65;font-style:italic}.composer{display:flex;gap:10px;padding:14px}.composer input{flex:1;min-width:0;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--surface);color:var(--text);outline:none}.composer button,header button{border:0;background:var(--accent);color:var(--bg);padding:12px 18px;font-weight:800}header{display:flex;align-items:center;gap:14px}h1,h2,p{margin:0}small,span{color:var(--muted)}body{background:linear-gradient(135deg,#060816,var(--bg))}.glassbar{padding:18px 5%%;background:#ffffff08;border-bottom:1px solid #ffffff18;backdrop-filter:blur(18px)}.glass-logo{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--accent);color:var(--bg);font-size:23px}.glassbar>div:nth-child(2){flex:1}.glassbar h1{font-size:22px}.status{font-size:10px;letter-spacing:.15em}.status i{display:inline-block;width:7px;height:7px;border-radius:50%%;background:var(--accent);margin-right:5px}.glassbar button{background:#ffffff0d;color:var(--text);border:1px solid #ffffff22}.glass-stage{width:min(920px,94%%);margin:32px auto;padding:28px;border:1px solid #ffffff18;border-radius:30px;background:#ffffff08;box-shadow:0 25px 80px #0005;backdrop-filter:blur(20px)}.intro{padding:8px 4px 20px}.intro span{font-size:10px;letter-spacing:.2em;color:var(--accent)}.intro h2{font-size:32px;margin:10px 0}.chat{background:#0002;border-radius:22px}.composer{background:#0003;border-radius:18px}.composer input{border-radius:14px}.composer button{border-radius:14px}@media(max-width:700px){.paper,.shield-layout,.dash-grid{grid-template-columns:1fr}.paper aside,.shield-layout aside,.dash-grid aside{display:none}.chat{max-height:55vh}.msg{max-width:92%%}.brute-head{display:block}.brute-head button{margin-top:16px}.dash-actions .chip{display:none}}</style></head><body><header class="glassbar"><div class="glass-logo">◈</div><div><h1>{{ config.TITLE }}</h1><span>{{ config.DOMAIN }}</span></div><div class="status"><i></i> ONLINE</div><button id="clearBtn">Clear</button></header><main class="glass-stage"><div class="intro"><span>PRIVATE STUDY SPACE</span><h2>{{ config.WELCOME }}</h2><p>Session history is temporary and isolated to this browser session.</p></div><div id="chat" class="chat"></div><form id="chatForm" class="composer"><input id="message" autocomplete="off" maxlength="{{ config.MAX_INPUT_CHARS }}" placeholder="Message your tutor..." /><button type="submit">Send</button></form></main><script>const csrf="{{ csrf }}";const chat=document.getElementById("chat"),form=document.getElementById("chatForm"),input=document.getElementById("message"),clearBtn=document.getElementById("clearBtn");function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function render(h){chat.innerHTML="";h.forEach(m=>{const e=document.createElement("div");e.className="msg "+(m.role==="user"?"user":"model");e.innerHTML=`<div class="meta">${m.role==="user"?"You":"Tutor"}</div>${esc(m.text)}`;chat.appendChild(e)});chat.scrollTop=chat.scrollHeight;}async function send(e){e.preventDefault();const message=input.value.trim();if(!message){input.focus();return;}input.disabled=true;input.value="";const t=document.createElement("div");t.className="msg model typing";t.textContent="Thinking…";chat.appendChild(t);chat.scrollTop=chat.scrollHeight;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,csrf})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");render(d.history||[]);}catch(err){t.remove();const e=document.createElement("div");e.className="msg model";e.innerHTML=`<div class="meta">Error</div>${esc(err.message)}`;chat.appendChild(e);}finally{input.disabled=false;input.focus();}}async function clearChat(){try{const r=await fetch("/api/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({csrf})});if(r.ok)chat.innerHTML="";else alert("Could not clear this session.");}catch(e){alert("Could not clear this session.");}}form.addEventListener("submit",send);clearBtn.addEventListener("click",clearChat);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});</script></body></html>
