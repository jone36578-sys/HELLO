<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110d"><title>Cyber Shield Academy</title><style> :root{--bg:#07110d;--surface:#0b1d14;--accent:#79ff9b;--text:#e9fff0;--muted:color-mix(in srgb,var(--text) 62%,transparent)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}body{min-height:100vh}button,input{font:inherit}button{cursor:pointer}.chat{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:220px;max-height:58vh;padding:18px}.msg{max-width:82%;padding:13px 16px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.msg.user{align-self:flex-end;background:var(--accent);color:var(--bg)}.msg.model{align-self:flex-start;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}.meta{font-size:11px;opacity:.6;margin-bottom:5px;text-transform:uppercase;letter-spacing:.08em}.typing{opacity:.65;font-style:italic}.composer{display:flex;gap:10px;padding:14px}.composer input{flex:1;min-width:0;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--surface);color:var(--text);outline:none}.composer button,header button{border:0;background:var(--accent);color:var(--bg);padding:12px 18px;font-weight:800}header{display:flex;align-items:center;gap:14px}h1,h2,p{margin:0}small,span{color:var(--muted)}body{background:linear-gradient(160deg,#020604,var(--bg))}.shield-head{padding:22px 5%;border-bottom:1px solid #214c34}.shield-icon{width:50px;height:50px;display:grid;place-items:center;border:2px solid var(--accent);clip-path:polygon(50% 0,90% 18%,82% 76%,50% 100%,18% 76%,10% 18%);color:var(--accent);font-size:25px}.shield-head>div:nth-child(2){flex:1}.shield-head small{color:var(--accent);letter-spacing:.16em}.shield-head h1{margin:4px 0}.shield-head button{background:transparent;color:var(--accent);border:1px solid var(--accent)}.shield-layout{width:min(1050px,92%);margin:35px auto;display:grid;grid-template-columns:220px 1fr;gap:32px}.seal{border:1px solid var(--accent);padding:15px;text-align:center;color:var(--accent);font-size:11px;letter-spacing:.15em}.shield-layout aside p{font-size:13px;line-height:1.6;margin-top:14px;color:var(--muted)}.welcome{padding:18px;border-left:3px solid var(--accent);background:#0d2418;margin-bottom:14px}.chat{background:#06100b;border:1px solid #173a27}.composer{background:#06100b;border:1px solid #173a27}.composer input{background:#07150d}@media(max-width:700px){.paper,.shield-layout,.dash-grid{grid-template-columns:1fr}.paper aside,.shield-layout aside,.dash-grid aside{display:none}.chat{max-height:55vh}.msg{max-width:92%}.brute-head{display:block}.brute-head button{margin-top:16px}.dash-actions .chip{display:none}}</style></head><body><header class="shield-head"><div class="shield-icon">◇</div><div><small>SECURE LEARNING UNIT</small><h1>{{ config.TITLE }}</h1><span>{{ config.DOMAIN }}</span></div><button id="clearBtn">Wipe Chat</button></header><main class="shield-layout"><aside><div class="seal">SCOPE LOCKED</div><p>Only configured-domain questions are answered.</p></aside><section><div class="welcome">{{ config.WELCOME }}</div><div id="chat" class="chat"></div><form id="chatForm" class="composer"><input id="message" autocomplete="off" maxlength="{{ config.MAX_INPUT_CHARS }}" placeholder="Enter a study question..." /><button type="submit">Transmit</button></form></section></main><script>const csrf="{{ csrf }}";const chat=document.getElementById("chat"),form=document.getElementById("chatForm"),input=document.getElementById("message"),clearBtn=document.getElementById("clearBtn");function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}function render(h){chat.innerHTML="";h.forEach(m=>{const e=document.createElement("div");e.className="msg "+(m.role==="user"?"user":"model");e.innerHTML=`<div class="meta">${m.role==="user"?"You":"Tutor"}</div>${esc(m.text)}`;chat.appendChild(e)});chat.scrollTop=chat.scrollHeight;}async function send(e){e.preventDefault();const message=input.value.trim();if(!message){input.focus();return;}input.disabled=true;input.value="";const t=document.createElement("div");t.className="msg model typing";t.textContent="Thinking…";chat.appendChild(t);chat.scrollTop=chat.scrollHeight;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,csrf})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");render(d.history||[]);}catch(err){t.remove();const e=document.createElement("div");e.className="msg model";e.innerHTML=`<div class="meta">Error</div>${esc(err.message)}`;chat.appendChild(e);}finally{input.disabled=false;input.focus();}}async function clearChat(){try{const r=await fetch("/api/clear",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({csrf})});if(r.ok)chat.innerHTML="";else alert("Could not clear this session.");}catch(e){alert("Could not clear this session.");}}form.addEventListener("submit",send);clearBtn.addEventListener("click",clearChat);input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});</script></body></html>
