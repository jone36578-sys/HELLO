<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathMind AI</title>
<style>:root{--bg:#17110a;--a:#ffb000;--fg:#fff7e6;--p:#2a1c08;--font:"Georgia",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--font);display:flex;justify-content:center;align-items:center;padding:18px}.shell{width:min(1100px,100%);height:min(850px,94vh);display:flex;flex-direction:column;border:1px solid var(--a);background:var(--p);box-shadow:0 25px 80px #0008;border-radius:28px;overflow:hidden}header{padding:22px 24px;border-bottom:1px solid #ffffff22;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#ffb00018,transparent)}h1{margin:0;font-size:clamp(20px,3vw,30px)}header p{margin:5px 0 0;opacity:.7;font-size:13px}button{border:1px solid var(--a);background:transparent;color:var(--fg);padding:10px 15px;border-radius:8px;cursor:pointer}button:hover{background:var(--a);color:#000}.chat{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}.msg{max-width:82%;padding:13px 16px;line-height:1.55;white-space:pre-wrap;border-radius:8px}.user{align-self:flex-end;background:var(--a);color:#000}.bot{align-self:flex-start;background:#ffffff12;border-left:3px solid var(--a)}.composer{padding:16px;border-top:1px solid #ffffff22;display:flex;gap:10px}textarea{flex:1;resize:none;min-height:48px;border:1px solid #ffffff55;background:#0002;color:var(--fg);border-radius:8px;padding:13px;font:inherit;outline:none}.send{background:var(--a);color:#000;font-weight:700}.status{font-size:12px;opacity:.65;text-align:center;padding:0 24px 10px}@media(max-width:650px){body{padding:0}.shell{height:100vh;border-radius:0}.msg{max-width:92%}}</style></head>
<body><main class="shell"><header><div><h1>✦ MathMind AI</h1><p>Mathematics and Problem Solving</p></div><button id="clear">Clear</button></header><div id="chat" class="chat"><div class="msg bot">Hi! I’m MathMind AI. Ask me anything you want to learn about Mathematics and Problem Solving.</div></div><div id="status" class="status"></div><form id="form" class="composer"><textarea id="input" placeholder="Ask a Mathematics and Problem Solving question..."></textarea><button class="send" type="submit">Send ↗</button></form></main>
<script>const c=document.querySelector("#chat"),f=document.querySelector("#form"),i=document.querySelector("#input"),s=document.querySelector("#status");function add(t,w){let d=document.createElement("div");d.className="msg "+w;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight}f.onsubmit=async e=>{e.preventDefault();let m=i.value.trim();if(!m){s.textContent="Please enter a question.";return}add(m,"user");i.value="";i.disabled=true;s.textContent="Thinking...";try{let r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m})}),j=await r.json();if(!r.ok)throw Error(j.error);add(j.answer,"bot")}catch(e){add(e.message,"bot")}finally{i.disabled=false;s.textContent="";i.focus()}};i.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();f.requestSubmit()}};document.querySelector("#clear").onclick=async()=>{await fetch("/api/clear",{method:"POST"});c.innerHTML="";add("Hi! I\u2019m MathMind AI. Ask me anything you want to learn about Mathematics and Problem Solving.","bot");i.focus()}</script></body></html>
